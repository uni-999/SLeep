name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # A newer push to the same branch or pull request makes older runs useless.
  # Publishing lives in publish.yml, so cancelling a test run never interrupts it.
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Python, PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sleep_test
          POSTGRES_USER: sleep
          POSTGRES_PASSWORD: sleep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleep -d sleep_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the PostgreSQL migration test (upgrade, check, downgrade).
      SLEEP_TEST_DATABASE_URL: postgresql+psycopg://sleep:sleep@localhost:5432/sleep_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -v

  web:
    name: Web (lint, type-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in apps/web/package.json (packageManager).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check and build
        run: pnpm build

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^SLEEP_SEED_DEMO=.*/SLEEP_SEED_DEMO=true/' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test through the gateway
        run: |
          set -eu
          base=http://localhost:8080
          auth=analyst:sleep-local
          org='X-Organization-ID: org-demo'

          check_status() {
            expected=$1
            shift
            actual=$(curl -s -o /dev/null -w '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: expected HTTP $expected, got $actual for: $*"
              exit 1
            fi
            echo "ok: HTTP $actual for: $*"
          }

          check_status 401 "$base/"
          check_status 401 -H "$org" "$base/api/v1/devices"
          check_status 200 -u "$auth" "$base/"

          curl -fsS -u "$auth" "$base/" | grep -q '<div id="root">'
          curl -fsS -u "$auth" "$base/api/health" | grep -q '"ok"'
          curl -fsS -u "$auth" "$base/api/ready" | grep -q '"ready"'
          curl -fsS -u "$auth" -H "$org" "$base/api/v1/devices" | grep -q 'prod-web-01'
          echo "Smoke test passed"

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
