[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleep-api"
version = "0.1.0"
description = "SLeep security posture API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
