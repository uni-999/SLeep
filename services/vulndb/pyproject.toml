[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sleep-vulndb"
version = "0.1.0"
description = "SLeep vulnerability knowledge base updater (OSV, EPSS, CISA KEV)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.scripts]
sleep-vulndb = "sleep_vulndb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_vulndb"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a disposable PostgreSQL database in SLEEP_TEST_DATABASE_URL",
]
