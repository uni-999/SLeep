name: sleep

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-http://localhost}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env (see docs/self-hosting.md)}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      SLEEP_ROOT_PATH: /api
      SLEEP_DB_HOST: postgres
      SLEEP_DB_PORT: "5432"
      SLEEP_DB_NAME: ${POSTGRES_DB:-sleep}
      SLEEP_DB_USER: ${POSTGRES_USER:-sleep}
      SLEEP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SLEEP_SEED_DEMO: ${SLEEP_SEED_DEMO:-false}
    expose:
      - "8000"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  # Keeps the global vulnerability knowledge base (OSV Debian/Ubuntu, EPSS,
  # CISA KEV) up to date in the PostgreSQL schema "vulndb". It is the only
  # service with outbound internet access and it accepts no inbound traffic,
  # so it connects under its own role that owns only that schema.
  vulndb:
    build:
      context: ./services/vulndb
    restart: unless-stopped
    environment:
      SLEEP_DB_HOST: postgres
      SLEEP_DB_PORT: "5432"
      SLEEP_DB_NAME: ${POSTGRES_DB:-sleep}
      SLEEP_DB_USER: ${VULNDB_DB_USER:-sleep_vulndb}
      SLEEP_DB_PASSWORD: ${VULNDB_DB_PASSWORD:?Set VULNDB_DB_PASSWORD in .env}
      SLEEP_VULNDB_SOURCES: ${SLEEP_VULNDB_SOURCES:-}
      SLEEP_VULNDB_OSV_ECOSYSTEMS: ${SLEEP_VULNDB_OSV_ECOSYSTEMS:-}
      SLEEP_VULNDB_PROXY_URL: ${SLEEP_VULNDB_PROXY_URL:-}
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      # An explicit dependency also keeps `docker compose up --wait` from
      # treating the finished one-shot service as a failure.
      vulndb-init:
        condition: service_completed_successfully

  # One-shot: creates or updates the least-privileged role of vulndb
  # (deploy/postgres/vulndb-role.sql) and exits. It runs as the database owner,
  # so the internet-facing vulndb container never receives the owner's password.
  vulndb-init:
    image: postgres:16-alpine
    restart: "no"
    command: ["psql", "--no-psqlrc", "--quiet", "-v", "ON_ERROR_STOP=1", "-f", "/vulndb-role.sql"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-sleep}
      PGUSER: ${POSTGRES_USER:-sleep}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VULNDB_DB_USER: ${VULNDB_DB_USER:-sleep_vulndb}
      VULNDB_DB_PASSWORD: ${VULNDB_DB_PASSWORD:?Set VULNDB_DB_PASSWORD in .env}
    volumes:
      - ./deploy/postgres/vulndb-role.sql:/vulndb-role.sql:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sleep}
      POSTGRES_USER: ${POSTGRES_USER:-sleep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sleep} -d ${POSTGRES_DB:-sleep}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true
  # Outbound internet for the vulndb updater only. A separate network keeps it
  # out of reach of the public gateway.
  egress:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
