name: sleep

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-http://localhost}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      SLEEP_ROOT_PATH: /api
      SLEEP_DB_HOST: postgres
      SLEEP_DB_PORT: "5432"
      SLEEP_DB_NAME: ${POSTGRES_DB:-sleep}
      SLEEP_DB_USER: ${POSTGRES_USER:-sleep}
      SLEEP_DB_PASSWORD: ${POSTGRES_PASSWORD:-sleep}
      SLEEP_SEED_DEMO: ${SLEEP_SEED_DEMO:-false}
    expose:
      - "8000"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sleep}
      POSTGRES_USER: ${POSTGRES_USER:-sleep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sleep}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sleep} -d ${POSTGRES_DB:-sleep}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
